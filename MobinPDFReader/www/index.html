<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mobin PDF Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:#111827;font-family:sans-serif;color:#f9fafb;display:flex;flex-direction:column;height:100vh;}
.tribar{height:4px;background:linear-gradient(to right,#FF9933 33%,#fff 33%,#fff 66%,#138808 66%);flex-shrink:0;}
.topbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 10px 0;flex-shrink:0;}
.top-left{display:flex;flex-direction:column;gap:6px;}
.top-right{display:flex;flex-direction:column;gap:6px;}
.tbtn{padding:14px 10px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;text-align:center;width:100%;}
.tbtn-close{background:#dc2626;color:white;}
.tbtn-dev{background:transparent;color:#25D366;border:2px solid #25D366;}
.tbtn-more{background:linear-gradient(135deg,#FF9933,#cc5500);color:white;}
.tbtn-choose{background:#1f2937;color:#FF9933;border:2px solid #FF9933;}

/* MIDDLE */
.middle{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0;}
.status-box{background:#1f2937;border-radius:12px;padding:14px;text-align:center;color:#9ca3af;font-size:14px;flex-shrink:0;}
.page-info-row{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.page-info{color:#FF9933;font-size:13px;font-weight:700;flex:1;text-align:center;}
.translate-btn{padding:8px 14px;background:#1d4ed8;color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.progress-wrap{background:#374151;border-radius:6px;height:5px;overflow:hidden;flex-shrink:0;}
.progress-bar{height:5px;background:#FF9933;border-radius:6px;width:0%;transition:width 0.3s;}

/* PAGE TEXT BOX */
.page-text-box{background:#1f2937;border-radius:12px;padding:14px;color:#f9fafb;font-size:15px;line-height:1.8;flex:1;overflow-y:auto;min-height:80px;max-height:220px;display:none;}

/* RESULT BOX */
.result-box{background:#1f2937;border-radius:12px;padding:14px;color:#f9fafb;font-size:14px;line-height:1.7;max-height:220px;overflow-y:auto;display:none;white-space:pre-wrap;flex-shrink:0;}
.ask-wrap{display:none;flex-direction:column;gap:8px;flex-shrink:0;}
.ask-textarea{width:100%;padding:14px;background:#1f2937;color:white;border:2px solid #FF9933;border-radius:12px;font-size:15px;resize:none;height:90px;outline:none;}
.ask-send{padding:15px;background:#138808;color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;width:100%;}
.action-row{display:flex;gap:8px;flex-shrink:0;}
.action-row button{flex:1;padding:12px 6px;border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;background:#374151;color:#f9fafb;}

/* TRANSLATE PANEL */
.translate-panel{background:#1f2937;border-radius:12px;padding:14px;display:none;flex-direction:column;gap:10px;flex-shrink:0;}
.translate-panel select{width:100%;padding:12px;background:#111827;color:white;border:2px solid #1d4ed8;border-radius:10px;font-size:14px;outline:none;}
.translate-panel .det-lang{color:#9ca3af;font-size:13px;padding:4px 0;}
.translate-row{display:flex;gap:8px;}
.translate-row button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;}
.btn-translate{background:#1d4ed8;color:white;}
.btn-close-tr{background:#374151;color:#f9fafb;}

/* PLAYER */
.player{background:#0d1117;padding:10px;border-top:1px solid #1f2937;flex-shrink:0;}
.player-grid{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr 1fr;gap:6px;}
.ctrl{padding:16px 4px;border:none;border-radius:12px;font-weight:700;cursor:pointer;background:#1f2937;color:#f9fafb;border:1px solid #374151;font-size:12px;text-align:center;line-height:1.5;}
.ctrl.play{background:linear-gradient(135deg,#FF9933,#cc5500);color:white;font-size:22px;border:none;}
.ctrl:disabled{opacity:0.3;}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:#111827;z-index:9999;flex-direction:column;padding:16px;gap:8px;overflow-y:auto;}
.overlay.open{display:flex;}
.overlay-title{color:#FF9933;font-size:18px;font-weight:700;text-align:center;padding:10px 0;}
.obtn{padding:18px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;width:100%;margin-bottom:4px;}
.obtn-orange{background:linear-gradient(135deg,#FF9933,#cc5500);color:white;}
.obtn-grey{background:#374151;color:#f9fafb;}
.obtn-green{background:#138808;color:white;}
.obtn-red{background:#dc2626;color:white;}
.obtn-blue{background:#1d4ed8;color:white;}
.obtn-back{background:#1f2937;color:#9ca3af;border:2px solid #374151;}
.sub-panel{display:none;flex-direction:column;gap:10px;}
.sub-panel.open{display:flex;}
.sub-label{color:#9ca3af;font-size:13px;margin-bottom:4px;display:block;}
.sub-input{width:100%;padding:14px;background:#0d1117;color:white;border:2px solid #374151;border-radius:12px;font-size:15px;outline:none;margin-bottom:4px;}
.sub-input:focus{border-color:#FF9933;}
select.sub-input{cursor:pointer;}
.key-badge{background:#064e3b;color:#6ee7b7;padding:10px;border-radius:8px;font-size:13px;text-align:center;display:none;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="tribar"></div>

<div id="mainApp" style="display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="top-left">
      <button class="tbtn tbtn-close" id="closeBtn" onclick="handleClose()">✖ Close App</button>
      <button class="tbtn tbtn-dev" onclick="openDev()">💬 Developer</button>
    </div>
    <div class="top-right">
      <button class="tbtn tbtn-more" onclick="openOverlay()">⚙️ More Options</button>
      <button class="tbtn tbtn-choose" onclick="document.getElementById('fileIn').click()">📂 Choose PDF</button>
      <input type="file" id="fileIn" accept=".pdf" style="display:none" onchange="loadPDF(this)">
    </div>
  </div>

  <!-- MIDDLE -->
  <div class="middle" id="middle">
    <div class="status-box" id="statusBox">📄 Mobin PDF Reader — Choose a PDF to begin</div>

    <!-- Page info + Translate button (shown after PDF load) -->
    <div class="page-info-row hidden" id="pageInfoRow">
      <div class="page-info" id="pageInfo">Page 1 of 1</div>
      <button class="translate-btn" onclick="toggleTranslate()">🌐 Translate</button>
    </div>

    <div class="progress-wrap hidden" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- TRANSLATE PANEL -->
    <div class="translate-panel" id="translatePanel">
      <div class="det-lang" id="detectedLang">🔍 Detecting language...</div>
      <select id="translateTo">
        <option value="Hindi">Hindi — हिंदी</option>
        <option value="Marathi">Marathi — मराठी</option>
        <option value="English">English</option>
        <option value="Urdu">Urdu — اردو</option>
        <option value="Tamil">Tamil — தமிழ்</option>
        <option value="Telugu">Telugu — తెలుగు</option>
        <option value="Bengali">Bengali — বাংলা</option>
        <option value="Gujarati">Gujarati — ગુજરાતી</option>
        <option value="Kannada">Kannada — ಕನ್ನಡ</option>
        <option value="Malayalam">Malayalam — മലയാളം</option>
        <option value="Punjabi">Punjabi — ਪੰਜਾਬੀ</option>
        <option value="Arabic">Arabic — العربية</option>
        <option value="French">French — Français</option>
        <option value="Spanish">Spanish — Español</option>
        <option value="German">German — Deutsch</option>
        <option value="Japanese">Japanese — 日本語</option>
        <option value="Chinese">Chinese — 中文</option>
      </select>
      <div class="translate-row">
        <button class="btn-translate" onclick="doTranslate()">🌐 Translate Page</button>
        <button class="btn-close-tr" onclick="toggleTranslate()">✖ Close</button>
      </div>
    </div>

    <!-- PAGE TEXT BOX (shown after PDF load, TalkBack readable) -->
    <div class="page-text-box" id="pageTextBox" role="region" aria-label="Current page text" aria-live="polite" tabindex="0"></div>

    <!-- RESULT (summarize/ask/translate output) -->
    <div class="result-box" id="resultBox" role="region" aria-live="polite" tabindex="0"></div>
    <div class="action-row hidden" id="actionRow">
      <button onclick="copyResult()">📋 Copy</button>
      <button onclick="shareResult()">📤 Share</button>
    </div>

    <!-- ASK INPUT -->
    <div class="ask-wrap" id="askWrap">
      <textarea class="ask-textarea" id="askInput" placeholder="Ask anything about this PDF — numbers, names, dates..."></textarea>
      <button class="ask-send" onclick="doAsk()">📤 Send</button>
    </div>
  </div>

  <!-- PLAYER -->
  <div class="player" id="playerBar">
    <div class="player-grid">
      <button class="ctrl" id="btnRew" onclick="rewind()" onmousedown="holdStart('r')" onmouseup="holdStop()" ontouchstart="holdStart('r')" ontouchend="holdStop()" disabled>⏪<br>10s</button>
      <button class="ctrl" id="btnPrev" onclick="prevPage()" disabled>◀<br>Prev</button>
      <button class="ctrl play" id="btnPlay" onclick="togglePlay()" disabled>▶</button>
      <button class="ctrl" id="btnFwd" onclick="forward()" onmousedown="holdStart('f')" onmouseup="holdStop()" ontouchstart="holdStart('f')" ontouchend="holdStop()" disabled>⏩<br>10s</button>
      <button class="ctrl" id="btnNext" onclick="nextPage()" disabled>▶▶<br>Next</button>
    </div>
  </div>
</div>

<!-- MORE OPTIONS OVERLAY -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div id="mainMenu">
    <div class="overlay-title">⚙️ More Options</div>
    <div class="key-badge" id="keyBadge">✅ API Key Saved</div>
    <button class="obtn obtn-orange" onclick="showSub('apiSub')">🔑 Set API Key</button>
    <button class="obtn obtn-grey" onclick="showSub('modeSub')">🎵 TTS Mode & Voice</button>
    <button class="obtn obtn-blue" onclick="startSummarize()">📋 Summarize PDF</button>
    <button class="obtn obtn-green" onclick="startAsk()">❓ Ask PDF</button>
    <button class="obtn obtn-grey" onclick="downloadCurrentPage()">⬇ Download Current Page Audio</button>
    <button class="obtn obtn-grey" onclick="downloadAllPlayed()">⬇ Download All Played Pages</button>
    <button class="obtn obtn-grey" onclick="doCopy()">📋 Copy Page Text</button>
    <button class="obtn obtn-grey" onclick="doShare()">📤 Share Page Text</button>
    <button class="obtn obtn-red" onclick="closeOverlay()">✖ Close</button>
  </div>

  <!-- API KEY -->
  <div class="sub-panel" id="apiSub">
    <div class="overlay-title">🔑 Set API Key</div>
    <span class="sub-label">Enter your Gemini API Key</span>
    <input type="text" class="sub-input" id="apiInput" placeholder="AIzaSy...">
    <div id="apiMsg" style="color:#fca5a5;font-size:13px;display:none;padding:6px 0;"></div>
    <button class="obtn obtn-green" onclick="saveKey()">✅ Save</button>
    <button class="obtn obtn-back" onclick="hideSub('apiSub')">← Back</button>
  </div>

  <!-- TTS MODE -->
  <div class="sub-panel" id="modeSub">
    <div class="overlay-title">🎵 TTS Mode & Voice</div>
    <span class="sub-label">Select reading mode</span>
    <select class="sub-input" id="modeSelect" onchange="onModeChange()">
      <option value="system">System TTS — Free, No API Key</option>
      <option value="gemini">Gemini Audio — API Key Required</option>
    </select>
    <div id="voiceWrap" style="display:none;flex-direction:column;gap:8px;margin-top:4px;">
      <span class="sub-label">🎤 Select Gemini Voice</span>
      <select class="sub-input" id="voiceSelect">
        <option value="Zephyr">Zephyr — Smooth</option>
        <option value="Puck">Puck — Upbeat</option>
        <option value="Charon">Charon — Deep</option>
        <option value="Kore">Kore — Firm</option>
        <option value="Fenrir">Fenrir — Excitable</option>
        <option value="Leda">Leda — Youthful</option>
        <option value="Orus">Orus — Confident</option>
        <option value="Aoede">Aoede — Breezy</option>
        <option value="Callirrhoe">Callirrhoe — Easy-going</option>
        <option value="Autonoe">Autonoe — Bright</option>
        <option value="Enceladus">Enceladus — Breathy</option>
        <option value="Iapetus">Iapetus — Clear</option>
        <option value="Umbriel">Umbriel — Easy-going</option>
        <option value="Algieba">Algieba — Smooth</option>
        <option value="Despina">Despina — Smooth</option>
        <option value="Erinome">Erinome — Clear</option>
        <option value="Algenib">Algenib — Gravelly</option>
        <option value="Rasalgethi">Rasalgethi — Informative</option>
        <option value="Laomedeia">Laomedeia — Upbeat</option>
        <option value="Achernar">Achernar — Soft</option>
        <option value="Alnilam">Alnilam — Firm</option>
        <option value="Schedar">Schedar — Even</option>
        <option value="Gacrux">Gacrux — Mature</option>
        <option value="Pulcherrima">Pulcherrima — Forward</option>
        <option value="Achird">Achird — Friendly</option>
        <option value="Zubenelgenubi">Zubenelgenubi — Casual</option>
        <option value="Vindemiatrix">Vindemiatrix — Gentle</option>
        <option value="Sadachbia">Sadachbia — Lively</option>
        <option value="Sadaltager">Sadaltager — Knowledgeable</option>
        <option value="Sulafat">Sulafat — Warm</option>
      </select>
    </div>
    <button class="obtn obtn-green" onclick="saveMode()" style="margin-top:10px;">✅ Save</button>
    <button class="obtn obtn-back" onclick="hideSub('modeSub')">← Back</button>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc=null,totalPages=0,currentPage=1,pageTexts={},pageAudioBlobs={};
let isPlaying=false,autoQ=false,ttsMode='system',geminiVoice='Zephyr';
let currentAudio=null,holdTimer=null,lastResult='',appMode='normal';
let translateOpen=false;

// ---- SEEK STATE (10s skip for both System TTS and Gemini Audio) ----
let sysFullText='',sysCharPos=0,sysBaseOffset=0;
const SYS_CHARS_PER_SEC=15; // approx speaking speed at rate 1.0 (~150 wpm)
const SKIP_CHARS=SYS_CHARS_PER_SEC*10; // ~10 seconds worth of characters

const g=id=>document.getElementById(id);

// ---- UNIFIED TTS ----
// Browser (Chrome) has Web Speech API voices, so speechSynthesis works when
// testing this HTML file directly. Inside the built APK (Android WebView),
// there are no Web Speech voices registered, so speechSynthesis.speak()
// silently does nothing. When the app is running natively and the
// @capgo/capacitor-speech-synthesis plugin is available, we route speech
// through it (real Android TTS engine) instead.
const nativeTTS=(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechSynthesis) ? window.Capacitor.Plugins.SpeechSynthesis : null;
const ttsPending={};
if(nativeTTS){
  nativeTTS.addListener('start',e=>{const cb=ttsPending[e.utteranceId];if(cb&&cb.onStart)cb.onStart();});
  nativeTTS.addListener('end',e=>{const cb=ttsPending[e.utteranceId];if(cb&&cb.onEnd)cb.onEnd();delete ttsPending[e.utteranceId];});
  nativeTTS.addListener('error',e=>{const cb=ttsPending[e.utteranceId];if(cb&&cb.onError)cb.onError(e);delete ttsPending[e.utteranceId];});
}
async function ttsSpeak(text,{onStart,onEnd,onError,onBoundary}={}){
  if(nativeTTS){
    try{
      const {utteranceId}=await nativeTTS.speak({text,language:'en-US',rate:1.0,pitch:1.0,volume:1.0,queueStrategy:'Flush'});
      ttsPending[utteranceId]={onStart,onEnd,onError};
    }catch(e){if(onError)onError(e);}
  }else{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=1.0;u.volume=1.0;
    if(onStart)u.onstart=onStart;
    if(onEnd)u.onend=onEnd;
    if(onError)u.onerror=onError;
    if(onBoundary)u.onboundary=onBoundary;
    speechSynthesis.speak(u);
  }
}
function ttsCancel(){
  if(nativeTTS)nativeTTS.cancel().catch(()=>{});
  else speechSynthesis.cancel();
}

window.onload=()=>{
  ttsMode=localStorage.getItem('mpdf_mode')||'system';
  geminiVoice=localStorage.getItem('mpdf_voice')||'Zephyr';
  if(localStorage.getItem('mpdf_key')) setSt('✅ API Key saved — Choose a PDF to begin');
  if(!nativeTTS){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
  }
};

// ---- OVERLAY ----
function openOverlay(){
  showMainMenu();
  g('keyBadge').style.display=localStorage.getItem('mpdf_key')?'block':'none';
  g('overlay').classList.add('open');
  g('mainApp').setAttribute('aria-hidden','true');
  g('mainApp').setAttribute('inert','');
  setTimeout(()=>{const f=g('overlay').querySelector('button');if(f)f.focus();},50);
}
function closeOverlay(){
  g('overlay').classList.remove('open');
  g('mainApp').removeAttribute('aria-hidden');
  g('mainApp').removeAttribute('inert');
}
function showMainMenu(){
  g('mainMenu').style.display='block';
  document.querySelectorAll('.sub-panel').forEach(p=>p.classList.remove('open'));
}
function showSub(id){
  g('mainMenu').style.display='none';
  document.querySelectorAll('.sub-panel').forEach(p=>p.classList.remove('open'));
  g(id).classList.add('open');
  if(id==='apiSub'){g('apiInput').value=localStorage.getItem('mpdf_key')||'';g('apiMsg').style.display='none';}
  if(id==='modeSub'){g('modeSelect').value=ttsMode;onModeChange();}
  setTimeout(()=>{const f=g(id).querySelector('input,select,button');if(f)f.focus();},50);
}
function hideSub(id){g(id).classList.remove('open');showMainMenu();}
function onModeChange(){
  const m=g('modeSelect').value;
  g('voiceWrap').style.display=m==='gemini'?'flex':'none';
}
function saveKey(){
  const k=g('apiInput').value.trim();
  const msg=g('apiMsg');
  if(!k||k.length<20){msg.style.display='block';msg.textContent='⚠️ Please enter a valid API Key';speak('Please enter a valid API Key');return;}
  localStorage.setItem('mpdf_key',k);
  msg.style.display='none';
  setSt('✅ API Key saved!');speak('API Key saved successfully');
  hideSub('apiSub');closeOverlay();
}
function saveMode(){
  ttsMode=g('modeSelect').value;
  geminiVoice=g('voiceSelect').value;
  localStorage.setItem('mpdf_mode',ttsMode);
  localStorage.setItem('mpdf_voice',geminiVoice);
  const label=ttsMode==='gemini'?'Gemini Audio':'System TTS';
  setSt('✅ Mode: '+label);speak('Mode saved: '+label);
  hideSub('modeSub');closeOverlay();
}

// ---- CLOSE ----
function handleClose(){
  if(appMode==='summarize')closeSummarize();
  else if(appMode==='ask')closeAsk();
  else closeApp();
}
function setCloseLabel(l){g('closeBtn').textContent='✖ '+l;}

// ---- LOAD PDF ----
async function loadPDF(input){
  const file=input.files[0];if(!file)return;
  setSt('⏳ Loading PDF...');
  try{
    const buf=await file.arrayBuffer();
    pdfDoc=await pdfjsLib.getDocument({data:buf}).promise;
    totalPages=pdfDoc.numPages;currentPage=1;pageTexts={};pageAudioBlobs={};
    const msg=`✅ "${file.name}" — ${totalPages} pages`;
    setSt(msg);speak(msg);
    g('pageInfoRow').classList.remove('hidden');
    g('progressWrap').classList.remove('hidden');
    g('pageTextBox').style.display='block';
    enableCtrl(true);updatePage();
    await extractText(1);
    showPageText(1);
    if(totalPages>1) extractText(2);
  }catch(e){setSt('❌ '+e.message);speak('Error loading PDF');}
}

async function extractText(n){
  if(pageTexts[n])return pageTexts[n];
  try{
    const pg=await pdfDoc.getPage(n);
    const c=await pg.getTextContent();
    pageTexts[n]=c.items.map(i=>i.str).join(' ').trim()||'[No text found on this page]';
    return pageTexts[n];
  }catch(e){return '[Error reading page '+n+']';}
}

function showPageText(n){
  extractText(n).then(text=>{
    const box=g('pageTextBox');
    box.textContent=text;
    box.setAttribute('aria-label','Page '+n+' text: '+text.substring(0,100));
  });
}

function enableCtrl(on){
  ['btnPlay','btnPrev','btnNext','btnRew','btnFwd'].forEach(id=>g(id).disabled=!on);
  if(on){setSt('Ready — tap ▶ to listen');speak('PDF ready. Tap play to listen.');}
}

function updatePage(){
  g('pageInfo').textContent=`Page ${currentPage} of ${totalPages}`;
  g('progressBar').style.width=((currentPage/totalPages)*100)+'%';
  showPageText(currentPage);
}

// ---- TRANSLATE ----
function toggleTranslate(){
  translateOpen=!translateOpen;
  const panel=g('translatePanel');
  panel.style.display=translateOpen?'flex':'none';
  if(translateOpen) detectLanguage();
}

async function detectLanguage(){
  const k=localStorage.getItem('mpdf_key')||'';
  if(!k){g('detectedLang').textContent='⚠️ Set API Key to detect language';return;}
  g('detectedLang').textContent='🔍 Detecting language...';
  const text=await extractText(currentPage);
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${k}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:`What language is this text written in? Reply with just the language name in English, nothing else:\n\n${text.substring(0,500)}`}]}]})
    });
    const d=await r.json();
    if(d.error){g('detectedLang').textContent='⚠️ Could not detect';return;}
    const lang=d.candidates[0].content.parts[0].text.trim();
    g('detectedLang').textContent=`📄 Detected Language: ${lang}`;
    speak('Detected language: '+lang);
  }catch(e){g('detectedLang').textContent='⚠️ Detection failed';}
}

async function doTranslate(){
  const k=localStorage.getItem('mpdf_key')||'';
  if(!k){speak('Please set API Key first');return;}
  if(!pdfDoc){speak('Please select a PDF first');return;}
  const toLang=g('translateTo').value;
  const text=await extractText(currentPage);
  g('resultBox').style.display='block';
  g('resultBox').textContent=`⏳ Translating to ${toLang}...`;
  g('actionRow').classList.add('hidden');
  speak('Translating to '+toLang+', please wait');
  toggleTranslate();
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${k}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:`Translate the following text to ${toLang}. Only provide the translation, nothing else:\n\n${text}`}]}]})
    });
    if(!r.ok){const e=await r.json();g('resultBox').textContent='❌ '+(e.error?.message||r.status);return;}
    const d=await r.json();
    if(d.error){g('resultBox').textContent='❌ '+d.error.message;return;}
    lastResult=d.candidates[0].content.parts[0].text;
    g('resultBox').textContent=`🌐 Translation to ${toLang}:\n\n`+lastResult;
    g('actionRow').classList.remove('hidden');
    speak(lastResult);
  }catch(e){g('resultBox').textContent='❌ '+e.message;speak('Translation failed');}
}

// ---- PLAY ----
async function togglePlay(){
  if(isPlaying){pauseAll();return;}
  isPlaying=true;autoQ=true;
  g('btnPlay').textContent='⏸';
  const text=await extractText(currentPage);
  if(ttsMode==='gemini')await playGemini(text);
  else playSystem(text);
  if(currentPage<totalPages)extractText(currentPage+1);
}

function pauseAll(){
  isPlaying=false;autoQ=false;
  g('btnPlay').textContent='▶';
  clearInterval(sysTimer);
  ttsCancel();
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  setSt('⏸ Paused');
}

// ---- SYSTEM TTS ----
let sysSeeking=false,sysTimer=null;
function playSystem(text){
  sysFullText=text;
  sysCharPos=0;
  sysSpeakFromPos();
}
function sysSpeakFromPos(){
  sysSeeking=true;
  clearInterval(sysTimer);
  ttsCancel();
  sysBaseOffset=sysCharPos;
  const sub=sysFullText.substring(sysBaseOffset);
  ttsSpeak(sub,{
    onStart:()=>{
      sysSeeking=false;
      setSt(`🔊 Reading page ${currentPage} of ${totalPages}...`);
      // Native Android TTS doesn't reliably report per-character boundaries
      // on every device, so estimate progress by elapsed time instead —
      // good enough for the 10s rewind/forward skip.
      if(nativeTTS){
        clearInterval(sysTimer);
        sysTimer=setInterval(()=>{sysCharPos+=SYS_CHARS_PER_SEC/4;},250);
      }
    },
    onBoundary:(e)=>{ if(typeof e.charIndex==='number') sysCharPos=sysBaseOffset+e.charIndex; },
    onEnd:async()=>{
      clearInterval(sysTimer);
      if(sysSeeking)return; // utterance was cancelled because of a manual rewind/forward seek
      if(!autoQ)return;
      if(currentPage<totalPages){
        currentPage++;updatePage();
        await sleep(300);
        if(autoQ){const t=await extractText(currentPage);playSystem(t);}
      }else{
        isPlaying=false;autoQ=false;
        g('btnPlay').textContent='▶';
        setSt('✅ Reading complete!');speak('Reading complete');
      }
    },
    onError:()=>{
      clearInterval(sysTimer);
      if(sysSeeking)return;isPlaying=false;g('btnPlay').textContent='▶';setSt('❌ TTS error');
    }
  });
}

// ---- GEMINI TTS ----
function createWav(len){
  const sr=24000,ch=1,bps=16,br=sr*bps/8,ba=bps/8,cs=36+len;
  const b=new ArrayBuffer(44);const v=new DataView(b);
  v.setUint8(0,0x52);v.setUint8(1,0x49);v.setUint8(2,0x46);v.setUint8(3,0x46);
  v.setUint32(4,cs,true);
  v.setUint8(8,0x57);v.setUint8(9,0x41);v.setUint8(10,0x56);v.setUint8(11,0x45);
  v.setUint8(12,0x66);v.setUint8(13,0x6D);v.setUint8(14,0x74);v.setUint8(15,0x20);
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,br,true);v.setUint16(32,ba,true);v.setUint16(34,bps,true);
  v.setUint8(36,0x64);v.setUint8(37,0x61);v.setUint8(38,0x74);v.setUint8(39,0x61);
  v.setUint32(40,len,true);return b;
}
function b64(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}

async function playGemini(text,retry=2){
  const k=localStorage.getItem('mpdf_key')||'';
  if(!k){setSt('❌ Set API Key in ⚙️ More Options');speak('Please set API Key');isPlaying=false;g('btnPlay').textContent='▶';return;}
  setSt(`⏳ Generating audio for page ${currentPage}...`);
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${k}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:'Read this text naturally: '+text}]}],
        generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:geminiVoice}}}}})
    });
    if(r.status===429){
      if(retry>0){setSt('⏳ Rate limit — retrying in 10s...');await sleep(10000);return playGemini(text,retry-1);}
      setSt('❌ Rate limit. Use System TTS.');isPlaying=false;g('btnPlay').textContent='▶';return;
    }
    if(!r.ok){const e=await r.json();setSt('❌ '+(e.error?.message||r.status));speak('API error');isPlaying=false;g('btnPlay').textContent='▶';return;}
    const d=await r.json();
    if(d.error){setSt('❌ '+d.error.message);speak(d.error.message);isPlaying=false;g('btnPlay').textContent='▶';return;}
    const bytes=b64(d.candidates[0].content.parts[0].inlineData.data);
    const hdr=createWav(bytes.length);
    const wav=new Uint8Array(hdr.byteLength+bytes.length);
    wav.set(new Uint8Array(hdr),0);wav.set(bytes,hdr.byteLength);
    const wavBlob=new Blob([wav],{type:'audio/wav'});
    pageAudioBlobs[currentPage]=wavBlob;
    const url=URL.createObjectURL(wavBlob);
    const audio=new Audio(url);currentAudio=audio;
    setSt(`🎵 Playing page ${currentPage} of ${totalPages} — ${geminiVoice}`);
    audio.play();
    audio.onended=async()=>{
      if(autoQ&&currentPage<totalPages){
        currentPage++;updatePage();
        await sleep(4000);
        if(autoQ){const t=await extractText(currentPage);await playGemini(t);}
      }else{
        isPlaying=false;autoQ=false;
        g('btnPlay').textContent='▶';
        setSt('✅ Reading complete!');
      }
    };
  }catch(e){setSt('❌ '+e.message);speak('Error occurred');isPlaying=false;g('btnPlay').textContent='▶';}
}

// ---- NAV (Prev/Next = change page) ----
function prevPage(){if(currentPage>1){pauseAll();currentPage--;updatePage();setSt(`Page ${currentPage} of ${totalPages}`);speak('Page '+currentPage);}}
function nextPage(){if(currentPage<totalPages){pauseAll();currentPage++;updatePage();setSt(`Page ${currentPage} of ${totalPages}`);speak('Page '+currentPage);}}

// ---- REWIND/FORWARD = 10 second audio seek (works in both System TTS & Gemini Audio modes) ----
function rewind(){
  if(!isPlaying)return;
  if(ttsMode==='gemini')gemSeek(-10);
  else sysSeek(-SKIP_CHARS);
}
function forward(){
  if(!isPlaying)return;
  if(ttsMode==='gemini')gemSeek(10);
  else sysSeek(SKIP_CHARS);
}
function holdStart(d){holdTimer=setInterval(()=>{d==='r'?rewind():forward();},700);}
function holdStop(){clearInterval(holdTimer);holdTimer=null;}

// Gemini Audio: real <audio> element supports direct currentTime seeking
function gemSeek(deltaSeconds){
  if(!currentAudio)return;
  const dur=currentAudio.duration||Infinity;
  let t=currentAudio.currentTime+deltaSeconds;
  if(t<0)t=0;
  if(t>dur)t=dur;
  currentAudio.currentTime=t;
  setSt((deltaSeconds<0?'⏪ Rewind 10s — ':'⏩ Forward 10s — ')+`Page ${currentPage} of ${totalPages}`);
}

// System TTS: speechSynthesis has no native seek, so we restart the utterance
// from an estimated character position (~10s worth of characters away).
function sysSeek(deltaChars){
  if(!sysFullText)return;
  let pos=sysCharPos+deltaChars;
  if(pos<0)pos=0;
  if(pos>=sysFullText.length)pos=Math.max(0,sysFullText.length-1);
  sysCharPos=pos;
  setSt((deltaChars<0?'⏪ Rewind 10s — ':'⏩ Forward 10s — ')+`Page ${currentPage} of ${totalPages}`);
  sysSpeakFromPos();
}

// ---- DOWNLOAD ----
function downloadCurrentPage(){
  closeOverlay();
  if(ttsMode!=='gemini'){speak('Download works only in Gemini Audio mode');setSt('⚠️ Switch to Gemini Audio mode');return;}
  const blob=pageAudioBlobs[currentPage];
  if(!blob){speak('No audio for this page. Play it first.');setSt('⚠️ Play this page first');return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`Page_${currentPage}.wav`;
  a.click();
  speak('Downloading Page '+currentPage);
  setSt(`⬇ Downloading Page_${currentPage}.wav`);
}
function downloadAllPlayed(){
  closeOverlay();
  if(ttsMode!=='gemini'){speak('Download works only in Gemini Audio mode');setSt('⚠️ Switch to Gemini Audio mode');return;}
  const pages=Object.keys(pageAudioBlobs).sort((a,b)=>a-b);
  if(pages.length===0){speak('No audio generated yet. Play PDF first.');setSt('⚠️ Play PDF first');return;}
  speak('Downloading '+pages.length+' pages');
  setSt(`⬇ Downloading ${pages.length} pages...`);
  pages.forEach((p,i)=>{
    setTimeout(()=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(pageAudioBlobs[p]);
      a.download=`Page_${p}.wav`;
      a.click();
    },i*800);
  });
}

// ---- COPY/SHARE ----
function copyResult(){navigator.clipboard.writeText(lastResult).then(()=>speak('Copied to clipboard')).catch(()=>speak('Could not copy'));}
function shareResult(){if(navigator.share)navigator.share({text:lastResult});else copyResult();}
function doCopy(){if(pdfDoc&&pageTexts[currentPage])navigator.clipboard.writeText(pageTexts[currentPage]).then(()=>speak('Page text copied'));else speak('No page loaded');closeOverlay();}
function doShare(){if(pdfDoc&&pageTexts[currentPage]&&navigator.share)navigator.share({text:pageTexts[currentPage]});else doCopy();closeOverlay();}

function speak(text){try{ttsSpeak(text);}catch(e){}}
function openDev(){window.open('https://wa.me/917304545503','_blank');}

function setSt(msg){const el=g('statusBox');if(el)el.textContent=msg;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
